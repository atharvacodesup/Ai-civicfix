<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Work — Field Operations | AI CivicFix</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/field.css">
</head>
<body class="field-page">
  <div id="header-mount"></div>

  <main class="field-main">
    <div class="kicker">Field Operations</div>
    <h1 style="font-size:38px;margin:4px 0 20px;">MY WORK</h1>

    <div id="field-work-mount">
      <div class="work-card">
        <div class="row between" style="margin-bottom:12px;">
          <div>
            <h2 id="field-work-id" style="font-size:32px;margin:0;">No Work Assigned</h2>
            <h3 id="field-work-type" style="margin:2px 0 0;font-size:22px;opacity:0.85;">Field Operations</h3>
          </div>
          <span id="field-work-status" class="status" style="display:none;">ASSIGNED</span>
        </div>

        <div class="card no-shadow" style="border:1px solid var(--blue-mid);margin:16px 0;background:#F5F7FA;padding:12px 14px;">
          <div class="kicker" style="font-size:11px;color:var(--blue);">LOCATION</div>
          <p id="field-work-addr" style="font-weight:700;font-size:16px;margin:2px 0 4px;">Kolhapur Municipal Corporation</p>
          <div style="font-size:13px;line-height:1.5;color:#334155;">
            <div>Ward: <strong id="field-work-ward">--</strong></div>
            <div id="field-work-coords" style="font-family:monospace;font-size:12px;color:var(--blue);margin-top:2px;">Pending assignment</div>
          </div>
        </div>

        <div id="field-work-callout" class="callout" style="margin-bottom:20px;">
          <strong>Field Assignment:</strong><br>
          No municipal work orders currently dispatched.
        </div>

        <button id="field-start-btn" type="button" class="primary-btn" style="width:100%;display:none;">
          START WORK ➔
        </button>
      </div>
    </div>

    <div style="text-align:center;margin-top:32px;">
      <span class="demo-label">AI CivicFix — Hackathon Prototype</span>
    </div>
  </main>

  <script src="../js/mock-data.js"></script>
  <script src="../js/state.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/reports.js"></script>
  <script src="../js/services.js"></script>
  <script src="../js/field.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("header-mount").innerHTML = renderGlobalHeader({ role: "field" });
    FieldApp.initWork();
  </script>
</body>
</html>
