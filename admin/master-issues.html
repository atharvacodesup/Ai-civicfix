<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Incidents — AI CivicFix</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <div id="sidebar-mount"></div>

    <div class="admin-main">
      <div id="topbar-mount"></div>

      <main class="admin-content">
        <div class="row between" style="margin-bottom:12px;">
          <div>
            <div class="kicker">KMC Municipal Operations</div>
            <h1 style="font-size:38px;margin:4px 0 0;">MASTER INCIDENTS</h1>
          </div>
          <span class="demo-label">Demonstration Data</span>
        </div>

        <div class="card" style="margin:20px 0;">
          <div class="grid grid-4">
            <div>
              <label class="label">Department</label>
              <select id="filter-dept" class="select">
                <option value="All">All Departments</option>
                <option value="City Engineer / PWD">City Engineer / PWD</option>
                <option value="Health & Sanitation">Health & Sanitation</option>
                <option value="Water Supply & Drainage">Water Supply & Drainage</option>
                <option value="Electricity">Electricity</option>
                <option value="Garden">Garden</option>
                <option value="Encroachment">Encroachment</option>
              </select>
            </div>
            <div>
              <label class="label">Ward</label>
              <select id="filter-ward" class="select">
                <option value="All">All Wards</option>
                <option value="20">Ward 20</option>
                <option value="18">Ward 18</option>
                <option value="12">Ward 12</option>
                <option value="9">Ward 9</option>
                <option value="7">Ward 7</option>
              </select>
            </div>
            <div>
              <label class="label">Severity</label>
              <select id="filter-sev" class="select">
                <option value="All">All Severity</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div>
              <label class="label">Status</label>
              <select id="filter-status" class="select">
                <option value="All">All Status</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Pending">Pending</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card" style="padding:0;">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Problem</th>
                  <th>Location</th>
                  <th>Ward</th>
                  <th>Reports</th>
                  <th>Severity</th>
                  <th>Department</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="admin-issues-table">
                <!-- Populated by AdminApp.initMasterIssues() -->
              </tbody>
            </table>
          </div>
        </div>

        <div style="text-align:center;margin-top:28px;">
          <span class="demo-label">AI CivicFix — Hackathon Prototype</span>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/state.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/reports.js"></script>
  <script src="../js/services.js"></script>
  <script src="../js/routing.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("sidebar-mount").innerHTML = renderAdminSidebar("issues");
    document.getElementById("topbar-mount").innerHTML = renderAdminTopbar();
    AdminApp.initMasterIssues();
  </script>
</body>
</html>
